[package]
name = "aether-os-pacman-wrappers"
version = "1.0.0"
edition = "2021"
description = "Rust wrappers for pacman utilities (paccache, pacdiff, rankmirrors)"
authors = ["AetherForge Team"]
license = "MIT"

[[bin]]
name = "rankmirrors-rs"
path = "src/bin/rankmirrors.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
glob = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.10"
walkdir = "2.4"
libc = "0.2"
