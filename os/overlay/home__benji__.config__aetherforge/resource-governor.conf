# AetherForge 10.0.1 Adaptive Resource Governor
#
# The default thresholds are intentionally sized for a 16 GiB machine:
# pressure begins before physical headroom is exhausted, while PSI may
# escalate earlier if Linux reports real memory stalls.
poll_ms=2000
reserve_percent=15
high_percent=10
critical_percent=7.5

# Protected together: games + OBS + Discord/voice + audio/compositor support.
protected_patterns=obs,obs-studio,discord,vesktop,webcord,pipewire,pipewire-pulse,wireplumber,kwin_wayland,gamescope,pressure-vessel,proton,wine64,wineserver,opensanctuary,sto-linux,star trek online,diablo
game_patterns=gamescope,pressure-vessel,proton,wine64,wineserver,opensanctuary,sto-linux,star trek online,diablo
stream_patterns=obs,obs-studio
comms_patterns=discord,vesktop,webcord

# Background compute yields to the protected mixed workload.
background_patterns=cargo,rustc,cc1,cc1plus,clang,gcc,g++,lld,ninja,cmake,make
maintenance_patterns=baloo,baloo_file,tracker-miner,aether-app-scan,plasma-discover,discover

# Only under HIGH/CRITICAL memory pressure while game+OBS+comms are all active.
# STOP/CONT is reversible and avoids permanently changing nice levels.
pausable_patterns=cargo,rustc,cc1,cc1plus,clang,gcc,g++,lld,ninja,cmake,make

# Never demote an entire terminal scope because a compiler is inside it.
terminal_unit_patterns=terminal,konsole,kitty,alacritty,wezterm,gnome-terminal,aether-terminal
