[package]
name = "aetherforge-beacn-control"
version = "0.1.22"
edition = "2024"
license = "MIT"
description = "Clean-room Linux controller shell for BEACN Mic on AetherForge"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
beacn-lib = { git = "https://github.com/beacn-on-linux/beacn-lib.git", tag = "v0.4.3" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
