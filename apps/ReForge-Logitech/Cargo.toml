[workspace]
members = [
  "crates/reforge-core",
  "crates/reforge-protocol",
  "crates/reforge-hid",
  "crates/reforge-daemon",
  "crates/reforge-cli",
  "crates/reforge-gui",
]
resolver = "2"

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["ReForge contributors"]

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
hidapi = { version = "=2.6.6", default-features = false, features = ["linux-native-basic-udev"] }
clap = { version = "=4.6.4", features = ["derive"] }
eframe = { version = "=0.35.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
