[workspace]
resolver = "2"
members = [
    "crates/aether-lifecycle",
    "crates/aetherforge-ui",
    "crates/aether-core",
    "crates/aether-model-api",
    "crates/aether-chat",
    "crates/aether-storage",
    "crates/aether-model-runtime",
    "crates/aether-model-gguf",
    "crates/aether-model-native",
    "crates/aether-workspace",
    "crates/aether-tools",
    "crates/aether-system",
    "crates/aether-ui",
    "apps/aetherai-cli",
    "apps/aetherai-desktop",
    "xtask",
    "crates/aether-index",
    "crates/aether-retrieval",
    "crates/aether-import",
]

[workspace.package]
version = "0.3.7"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-core = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "io-std", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
