[package]
name = "forgeclean"
version = "1.0.16"
edition = "2024"
license = "MIT"
description = "AetherForge permanent cleanup, build-aware routing, ColdPack and DragonGlass GUI utility"

[dependencies]
sha2 = "0.10"
tar = "0.4.46"
zstd = "0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[lib]
name = "forgeclean"
path = "src/lib.rs"

[[bin]]
name = "forgeclean"
path = "src/main.rs"

[[bin]]
name = "forgeclean-gui"
path = "src/gui_main.rs"

[workspace]
